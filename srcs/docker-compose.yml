services:
  mariadb:
    image: mariadb
    container_name: mariadb

    build:
      context: ./requirements/mariadb

    env_file:
      - .env

    secrets:
      - db_password
      - db_root_password

    volumes:
      - mariadb_data:/var/lib/mysql

    networks:
      - inception

    restart: on-failure

  wordpress:
    image: wordpress
    container_name: wordpress

    build:
      context: ./requirements/wordpress

    env_file:
      - .env

    secrets:
      - db_password
      - wp_admin_password 
      - wp_user_password

    volumes:
      - wordpress_data:/var/www/html

    networks:
       - inception

    depends_on:
       - mariadb

    restart: on-failure

  nginx:
    image: nginx
    container_name: nginx

    build:
      context: ./requirements/nginx

    ports:
      - "443:443"

    volumes:
      - wordpress_data:/var/www/html:ro

    networks:
      - inception

    depends_on:
      - wordpress

    restart: on-failure

networks:
  inception:
     driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/wordpress

secrets:
  db_password: 
     file: ../secrets/db_password.txt
  db_root_password:
     file: ../secrets/db_root_password.txt
  wp_admin_password:
     file: ../secrets/wp_admin_password.txt
  wp_user_password:
     file: ../secrets/wp_user_password.txt
